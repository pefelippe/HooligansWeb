services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: torcidas
      POSTGRES_PASSWORD: torcidas
      POSTGRES_DB: torcidas
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torcidas"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
